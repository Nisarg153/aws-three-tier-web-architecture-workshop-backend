version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 16
  pre_build:
    commands:
      - echo Installing backend dependencies...
      - cd app-tier
      - npm install
  build:
    commands:
      - echo Preparing app artifacts...
      - cd ..
      - chmod +x scripts/*.sh
  post_build:
    commands:
      - echo Build completed.

artifacts:
  files:
    - '**/*'
  discard-paths: no
